  boost_signals: [italiano, italiana, "da remoto", "smart working", "partita iva"]
  restricted_signals: ["US only", "USA only", "must be in US", "US timezone", "North America only", "UK only", "United Kingdom only"]
  onsite_signals: ["on-site only", "onsite only", "in sede obbligatoria", "on-site", onsite, "in sede", hybrid, ibrido]
blacklist:
  hard: ["full-time employee", "full time permanent", assunzione, "tempo indeterminato", CCNL, RAL, stage, tirocinio, internship, apprenticeship, apprendistato, "relocation required", "W2 only", unpaid, "no pay", "for exposure", visibilità, "equity only", "revenue share only", volunteer, volontario, "work for free", "test gratuito", "free trial task", "spec work", "commission only", "solo provvigioni", MLM, "network marketing", "crypto pump", "get rich", "guaranteed income", casino, gambling, adult, escort]
  job_seeker_signals: ["[for hire]", "[for-hire]", "looking for work", "available for work"]
  out_of_scope: ["graphic design only", "logo design only", "video editing only", "copywriting only", "data entry", "virtual assistant", "social media manager", "SEO content writing", "translator only", "cold calling", "sales representative", "customer service", tutor, "looking for work"]
freelance_detection: [freelance, freelancer, contractor, contract, "project-based", "one-off", "one-time project", "short-term", consulenza, consulente, collaborazione, "partita iva", "p.iva", "a progetto", "lavoro a progetto", incarico]
employment_signals: ["full-time", "full time", permanent, "tempo indeterminato", assunzione, employment]
sources:
  remotive: {enabled: true, url: "https://remotive.com/api/remote-jobs", poll_hours: 6, params: {limit: 100}}
  remoteok: {enabled: true, url: "https://remoteok.com/api", poll_hours: 0}
  workingnomads: {enabled: true, url: "https://www.workingnomads.com/api/exposed_jobs/", poll_hours: 0}
  jobicy: {enabled: true, url: "https://jobicy.com/api/jobs", poll_hours: 1, params: {count: 100, geo: "europe"}}
  hackernews: {enabled: true, url: "https://hn.algolia.com/api/v1/search_by_date", poll_hours: 0, queries: [{query: "Freelancer Seeking freelancer", tags: comment}, {query: "Who is hiring", tags: story}, {query: "freelance developer", tags: comment}, {query: "cerco sviluppatore freelance", tags: comment}, {query: "sviluppo sito web Italia", tags: comment}]}
  arbeitnow: {enabled: true, url: "https://www.arbeitnow.com/api/job-board-api", poll_hours: 0}
  google_alerts: {enabled: false, env_url: GOOGLE_ALERTS_RSS_URL, poll_hours: 0}
runtime:
  request_timeout_seconds: 15
  retries: 2
  max_concurrency: 6
  user_agent: "JobRadarPersonal/1.0 (+https://github.com/ACTYKON/job-radar; personal job alerts)"
  digest_hour_utc: 17
  alert_failure_after: 3
  database: state/jobs.sqlite3
  llm_enabled: false
  llm_threshold: 65
  llm_model: gemini-2.5-flash
